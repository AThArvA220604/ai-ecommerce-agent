services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/ecommerce.db
      # These three are sourced from .env at the repo root (if present).
      # Copy .env.example to .env and uncomment USE_LLM=true + set OPENAI_API_KEY
      # to enable the LLM engine.
      - USE_LLM=${USE_LLM:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - db-data:/data
    healthcheck:
      # python:3.12-slim doesn't ship curl, so we use Python's stdlib
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)
              sys.exit(0)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
